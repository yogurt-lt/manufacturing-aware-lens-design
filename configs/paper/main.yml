- surface_idx: 12
  roc_scale: 1.005
  ai_scale: 0.985
  reason: last-asphere stress test
acceptance_max_rgb_rms_mm: 0.065
search:
  max_rounds: 12
  beam_width: 5
  exploration_slots: 2
  patience_rounds: 4
  max_trials_per_round: 20
  max_trials_per_parent: 5
  proposal_pool_size: 30
  use_balanced_proposals: true
  max_changes_per_trial: 1
  seed_recovery_steps: 220
  nominal_steps_per_trial: 55
  robust_steps_per_trial: 30
  evaluation_trials: 256
  global_best_metric: composite_score
  global_improvement_fraction: 0.0003
  resume: true
training_overrides:
  tolerance_draws_per_step: 2
  good_cost_weight: 0.008
  nominal_constraint_weight: 12.0
  yield_transition_mm: 0.004
  log_every: 5
sampling_overrides:
  num_grid: 3
  num_rays: 128
differentiable_mtf:
  weight: 5.0
  minimum_proxy_mtf: 0.04
  frequency_lp_per_mm: 50.0
  screen_diagonal_inch: 100
  screen_aspect_ratio:
  - 16
  - 9
  throw_ratio: 1.2
  field_fractions:
  - 0.0
  wavelengths_nm:
  - 635
  - 525
  - 465
  wavelength_weights:
  - 3
  - 5
  - 2
  rays_per_wavelength: 128
  ray_seed: 63702
proposal:
  wavelengths_nm:
  - 465
  - 525
  - 635
  melt_frequency_allowlist:
  - A
  - MA
  surface_types:
  - Spheric
  - Aspheric
  surface_indices:
  - 2
  - 3
  - 6
  - 8
  - 9
  - 11
  candidate_name_regex: '[hd]-[a-z0-9]+'
  candidate_name_regex_by_surface:
    11: d-[a-z0-9]+
  same_family_prefix: 0
  max_abs_delta_n: 0.04
  max_candidate_price_ratio: 1.0
  ranking: optical_first
  candidate_limit: 60
  max_per_surface: 10
  radial_allowance_mm: 0.5
  axial_allowance_mm: 0.5
  exclude_equivalent_materials: true
  equivalent_max_abs_delta_n: 1.0e-05
  equivalent_max_price_fraction: 1.0e-06
required_material_regex_by_surface:
  0: k26r
  11: d-[a-z0-9]+
score_weights:
  good_unit_cost: 0.25
  rms_p90: 1.0
  yield_shortfall: 0.2
  mtf_quality: 0.25
screening:
  metric: rms
  min_demo_yield: 0.1
  max_build_cost_ratio_to_reference: 1.1
process_cost:
  production_volume: 10000
  per_element_proxy:
    glass_sphere: 100
    glass_asphere: 500
    plastic_sphere: 60
    plastic_asphere: 120
  plastic_material_tokens:
  - k26r
  - k22r
  - zeonex
  preferred_glass_aspheres:
  - d-k9
  - d-fk61
  - d-fk61a
  nonpreferred_glass_asphere_penalty: 100
  tooling_proxy: 200000
layout_comparison:
  enabled: true
  initial_lens: search_start
  initial_title: Search start (documented stress test)
  depth: -1000.0
independent_mtf:
  enabled: true
  config: configs/paper/independent_mtf.yml
  frequency_lp_per_mm: 50.0
  device: cuda
matched_fixed_material_control:
  enabled: true
material_data_dir: private_data/material
