  reason: high-cost optical-neighbour start
- surface_idx: 9
  to: D-ZLAF52LA
  reason: high-cost optical-neighbour start
- surface_idx: 11
  to: D-LAK6
  reason: high-cost D-glass last asphere
seed_geometry_perturbations:
- surface_idx: 0
  roc_scale: 0.995
  ai_scale: 0.985
  reason: first-asphere stress test
- surface_idx: 1
  roc_scale: 1.005
  ai_scale: 0.985
  reason: first-asphere stress test
- surface_idx: 2
  roc_scale: 0.996
  d_next_delta_mm: 0.025
  reason: spherical-form stress test
- surface_idx: 3
  roc_scale: 1.004
